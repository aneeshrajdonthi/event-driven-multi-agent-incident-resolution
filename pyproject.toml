[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-resolution"
version = "0.1.0"
description = "Event-driven multi-agent incident resolution system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "qdrant-client>=1.7.0",
    "confluent-kafka>=2.3.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "tenacity>=8.2.0",
    "google-generativeai>=0.8.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6.0"]
dev = [
    "ragas>=0.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
incident-api = "src.api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
